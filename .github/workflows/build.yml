name: build

# 本机不需要安装 VS / .NET Framework SDK：在 GitHub 托管的 Windows 机器上编译，
# 只下载产物（exe + Provider dll）。
on:
  workflow_dispatch:
  push:
    paths:
      - "UnlockServer.Wpf/**"
      - "UnlockServer.Provider/**"
      - "UnlockServer/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # packages/ 被 .gitignore 排除，必须从 packages.config 还原。
      # 老式（非 SDK）csproj 单工程还原必须给 SolutionDir，否则 NuGet.targets 报
      # "No solution found. Restore against a solution or pass in /p:SolutionDir"。
      - name: Restore NuGet (packages.config layout)
        shell: pwsh
        run: |
          $solutionDir = $env:GITHUB_WORKSPACE.Replace('\', '/') + '/'
          Write-Host "SolutionDir=$solutionDir"
          msbuild UnlockServer.Wpf\UnlockServer.Wpf.csproj -t:restore -p:RestorePackagesConfig=true -p:SolutionDir=$solutionDir -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem packages -ErrorAction SilentlyContinue | Select-Object Name

      # 管理代码在 WPF 工程；老式 csproj 用显式 Compile 列表。
      # 平台名必须写 AnyCPU（无空格）：csproj 条件是 'Release|AnyCPU'，直接编 csproj
      # 没有 sln 那层 "Any CPU" -> "AnyCPU" 映射，否则报 OutputPath 未设置。
      - name: Build WPF (net48)
        run: >
          msbuild UnlockServer.Wpf\UnlockServer.Wpf.csproj
          -p:Configuration=Release
          -p:Platform=AnyCPU
          -v:m

      # vcxproj 后置事件靠 $(SolutionDir) 定位 WPF 输出目录，直接编时必须显式传入，
      # 否则拷贝会被 "if exist" 静默跳过。
      - name: Build Provider (x64)
        run: >
          msbuild UnlockServer.Provider\UnlockServer.Provider.vcxproj
          -p:Configuration=Release
          -p:Platform=x64
          -p:SolutionDir=${{ github.workspace }}/
          -v:m

      # 即便后置事件失效也保证落位：显式拷贝 + 强断言。
      - name: Ensure Provider dll in WPF output
        shell: pwsh
        run: |
          $source = "UnlockServer.Provider\bin\Release\UnlockServer.Provider.dll"
          $target = "UnlockServer.Wpf\bin\Release\UnlockServer.Provider.dll"
          if (!(Test-Path $source)) { throw "Provider build output missing: $source" }
          if (!(Test-Path $target)) { Copy-Item $source $target -Force }
          Get-ChildItem "UnlockServer.Wpf\bin\Release" | Select-Object Name, Length

      - name: Regression tests (net8.0, 23 scenarios)
        working-directory: tests/UnlockServer.RegressionTests
        run: dotnet run -c Release

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "UnlockServer.Wpf\bin\Release\*" out -Recurse
          Remove-Item "out\Logs" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath UnlockServer-Wpf-Release.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: UnlockServer-Wpf-Release
          path: UnlockServer-Wpf-Release.zip
          if-no-files-found: error
          retention-days: 30
