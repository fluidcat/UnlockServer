name: build-from-bundle

# 临时通道：本分支不含源码，从一个 git bundle 拉取后编译；
# commit message 里带 [push-source] 时，额外把源码推到 feature/network-control。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-from-bundle.yml"

permissions:
  contents: write

env:
  BUNDLE_URL: https://aka.doubaocdn.com/s/a2sj9aARkD
  SRC_BRANCH: feature/network-control
  TARGET_BRANCH: feature/network-control

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Fetch source bundle
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "src.bundle"
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile $path -UseBasicParsing
          git bundle verify $path
          git clone $path src -b $env:SRC_BRANCH
          git -C src log -1 --oneline

      # GITHUB_TOKEN 是 GitHub App 身份，没有 workflows 权限，
      # 不能推送包含 .github/workflows/** 改动的提交（remote rejected）。
      # 因此先把 workflow 目录从索引移除再推，build.yml 另行添加。
      - name: Publish source to target branch
        if: contains(github.event.head_commit.message, '[push-source]')
        working-directory: src
        shell: pwsh
        run: |
          if (Test-Path .github/workflows) {
            git rm -r --cached .github/workflows | Out-Null
            git -c user.name="UnlockServer CI" -c user.email="ci@users.noreply.github.com" commit --amend --no-edit
          }
          git log -1 --oneline
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/$env:TARGET_BRANCH --force
          if ($LASTEXITCODE -ne 0) { throw "push failed: $LASTEXITCODE" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet (packages.config layout)
        working-directory: src
        shell: pwsh
        run: |
          $solutionDir = (Join-Path $env:GITHUB_WORKSPACE 'src').Replace('\', '/') + '/'
          msbuild UnlockServer.Wpf\UnlockServer.Wpf.csproj -t:restore -p:RestorePackagesConfig=true -p:SolutionDir=$solutionDir -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem packages -ErrorAction SilentlyContinue | Select-Object Name

      - name: Build WPF (net48)
        working-directory: src
        shell: pwsh
        run: |
          msbuild UnlockServer.Wpf\UnlockServer.Wpf.csproj -p:Configuration=Release -p:Platform=AnyCPU -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Provider (x64)
        working-directory: src
        shell: pwsh
        run: |
          $solutionDir = (Join-Path $env:GITHUB_WORKSPACE 'src').Replace('\', '/') + '/'
          msbuild UnlockServer.Provider\UnlockServer.Provider.vcxproj -p:Configuration=Release -p:Platform=x64 -p:SolutionDir=$solutionDir -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Provider dll in WPF output
        working-directory: src
        shell: pwsh
        run: |
          $source = "UnlockServer.Provider\bin\Release\UnlockServer.Provider.dll"
          $target = "UnlockServer.Wpf\bin\Release\UnlockServer.Provider.dll"
          if (!(Test-Path $source)) { throw "Provider build output missing: $source" }
          if (!(Test-Path $target)) { Copy-Item $source $target -Force }
          Get-ChildItem "UnlockServer.Wpf\bin\Release" | Select-Object Name, Length

      - name: Regression tests (23 scenarios)
        working-directory: src/tests/UnlockServer.RegressionTests
        run: dotnet run -c Release

      - name: Package artifact
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "UnlockServer.Wpf\bin\Release\*" out -Recurse
          Remove-Item "out\Logs" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive out\* UnlockServer-Wpf-Release.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: UnlockServer-Wpf-Release
          path: src/UnlockServer-Wpf-Release.zip
          if-no-files-found: error
          retention-days: 30
